name: Release Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.12.0'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-archives: qtbase qtwayland icu
            cmake-args: ''
          - platform: windows-x64
            runner: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-archives: qtbase
            cmake-args: ''
          - platform: macos-arm64
            runner: macos-14
            qt-host: mac
            qt-arch: clang_64
            qt-archives: qtbase
            cmake-args: '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.4'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ip7z/7zip
          ref: 0766b733fe3e06dd2a7f9a3cfbf2108ac73abd17
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require tag to match application version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py --check-tag "$RELEASE_TAG"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libglib2.0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 patchelf
      - name: Configure Windows toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install official Qt kit
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          archives: ${{ matrix.qt-archives }}
          cache: true
      - name: Install official Windows Qt kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 py7zr==1.1.0 ninja==1.12.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/install-qt-windows.py --version "$env:QT_VERSION" --outputdir "$env:GITHUB_WORKSPACE/Qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qt = Join-Path $env:GITHUB_WORKSPACE "Qt/$env:QT_VERSION/msvc2022_64"
          "QT_ROOT_DIR=$qt" >> $env:GITHUB_ENV
          "$qt/bin" >> $env:GITHUB_PATH
      - name: Select Qt and fetch private license inputs
        run: |
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          python scripts/ci-qt-source.py
      - name: Build official Unix runtime
        if: runner.os != 'Windows'
        run: |
          ./scripts/build-codec-runtime.sh "$PWD/upstream"
          ./scripts/build-sfx.sh "$PWD/upstream"
      - name: Build official Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-codec-runtime.ps1 -UpstreamCheckout upstream -Architecture x64
          ./scripts/build-sfx.ps1 -UpstreamCheckout upstream -Architecture x64
      - name: Build Release application
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF ${{ matrix.cmake-args }}
          cmake --build build/release
      - name: Package runtime only
        if: runner.os != 'Windows'
        run: |
          python scripts/package.py \
            --qt-source "build/qt-source/qtbase-everywhere-src-${QT_VERSION}.tar.xz" \
            --qt-sha256 "build/qt-source/qtbase-everywhere-src-${QT_VERSION}.tar.xz.sha256" \
            --icu-license build/qt-source/icu-73.2-LICENSE
      - name: Package Windows runtime only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          $notices = Join-Path $env:VSINSTALLDIR 'Licenses/1033/Redist.txt'
          python scripts/package.py `
            --qt-source "build/qt-source/qtbase-everywhere-src-$env:QT_VERSION.tar.xz" `
            --qt-sha256 "build/qt-source/qtbase-everywhere-src-$env:QT_VERSION.tar.xz.sha256" `
            --vc-runtime "$crt" --vc-notices "$notices"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sevenzip-desktop-${{ matrix.platform }}
          path: |
            build/packages/sevenzip-desktop-*.zip
            build/packages/sevenzip-desktop-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
